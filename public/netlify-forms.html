<!DOCTYPE html>
<html>
<body>

  <!-- Contact form -->
  <form name="contact" data-netlify="true" netlify-honeypot="bot-field">
    <input type="hidden" name="form-name" value="contact" />
    <input name="bot-field" />
    <input name="name" />
    <input name="phone" />
    <input name="email" />
    <input name="address" />
    <input name="serviceType" />
    <input name="description" />
    <input name="contactMethod" />
    <input name="appointmentTime" />
    <input name="referral" />
  </form>

  <!-- Testimonials form -->
  <form name="testimonials" data-netlify="true" netlify-honeypot="bot-field">
    <input type="hidden" name="form-name" value="testimonials" />
    <input name="bot-field" />
    <input name="name" />
    <input name="rating" />
    <input name="quote" />
  </form>

  <!-- EasyEstimate form -->
  <form name="easy-estimate" data-netlify="true" netlify-honeypot="bot-field">
    <input type="hidden" name="form-name" value="easy-estimate" />
    <input name="bot-field" />
    <input name="name" />
    <input name="phone" />
    <input name="email" />
    <input name="address" />
    <input name="details" />
    <input name="Service Type" />
    <input name="Estimated Cost" />
  </form>

</body>
</html>
